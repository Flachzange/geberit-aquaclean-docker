name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      aquaclean_sha:
        description: AquaClean source commit for dev build
        required: false
        type: string

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            AQUACLEAN_REPO=https://github.com/jens62/geberit-aquaclean.git
            AQUACLEAN_VERSION=v3.1.2
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v3.1.2

      - name: Resolve dev source commit
        id: dev_source
        shell: bash
        run: |
          SHA="${{ github.event.inputs.aquaclean_sha }}"

          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote https://github.com/Flachzange/geberit-aquaclean.git refs/heads/dev | cut -f1)"
          fi

          if [ -z "$SHA" ]; then
            echo "ERROR: Could not determine AquaClean dev commit"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

          echo "Building AquaClean dev commit:"
          echo "$SHA"

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            AQUACLEAN_REPO=https://github.com/Flachzange/geberit-aquaclean.git
            AQUACLEAN_VERSION=dev
            AQUACLEAN_COMMIT=${{ steps.dev_source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Flachzange/geberit-aquaclean
            org.opencontainers.image.revision=${{ steps.dev_source.outputs.sha }}
            org.opencontainers.image.version=dev-${{ steps.dev_source.outputs.short_sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:dev-${{ steps.dev_source.outputs.short_sha }}
