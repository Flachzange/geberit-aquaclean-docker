name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      aquaclean_version:
        description: "geberit-aquaclean release/tag"
        required: true
        default: "v3.1.2"

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set AquaClean version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "AQUACLEAN_VERSION=${{ github.event.inputs.aquaclean_version }}" >> "$GITHUB_ENV"
          else
            echo "AQUACLEAN_VERSION=v3.1.2" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            AQUACLEAN_VERSION=${{ env.AQUACLEAN_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.AQUACLEAN_VERSION }}
